name: Bug Report
description: Report a reproducible problem with Eirdom Household
title: "[Bug]: "
labels:
    - bug
assignees:
    - SampleAssignee

body:
    - type: markdown
      attributes:
          value: |
            Thank you for helping improve Eirdom Household.

            Before submitting, please confirm that you are using a supported version
            and that the issue has not already been reported.

    - type: textarea
      id: summary
      attributes:
          label: Bug summary
          description: Clearly describe the problem.
          placeholder: Describe what went wrong.
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Steps to reproduce
          description: Provide the exact steps needed to reproduce the issue.
          placeholder: |
              1. Start the application
              2. Navigate to ...
              3. Select ...
              4. Observe ...
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
          description: Describe what you expected to happen.
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: Actual behavior
          description: Describe what actually happened.
      validations:
          required: true

    - type: input
      id: version
      attributes:
          label: Version or commit
          description: Enter the release version, branch, or commit SHA.
          placeholder: main or abc1234
      validations:
          required: true

    - type: dropdown
      id: component
      attributes:
          label: Affected component
          description: Select the component where the issue occurs.
          options:
              - Backend
              - Database
              - Docker or Docker Compose
              - Documentation
              - GitHub Actions
              - Web frontend
              - Mobile application
              - Other
      validations:
          required: true

    - type: textarea
      id: environment
      attributes:
          label: Environment
          description: Include relevant operating system, Docker, browser, and runtime details.
          placeholder: |
              Operating system:
              Docker version:
              Docker Compose version:
              Browser:
              Other relevant versions:
      validations:
          required: true

    - type: textarea
      id: logs
      attributes:
          label: Logs or screenshots
          description: Paste relevant logs or attach screenshots. Remove secrets and personal information.
          render: shell

    - type: checkboxes
      id: checks
      attributes:
          label: Submission checklist
          options:
              - label: I searched existing issues for duplicates.
                required: true
              - label: I removed secrets and sensitive information from logs and screenshots.
                required: true
              - label: This is not a security vulnerability.
                required: true
