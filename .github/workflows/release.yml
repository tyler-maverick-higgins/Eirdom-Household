name: Release Validation

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: eirdom_household
          POSTGRES_USER: eirdom
          POSTGRES_PASSWORD: release-validation-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eirdom -d eirdom_household"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: release-validation-only-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: eirdom_household
      POSTGRES_USER: eirdom
      POSTGRES_PASSWORD: release-validation-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run Ruff linting
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run Django system checks
        run: uv run python src/manage.py check

      - name: Check for missing migrations
        run: uv run python src/manage.py makemigrations --check

      - name: Apply migrations
        run: uv run python src/manage.py migrate --noinput

      - name: Run tests
        run: uv run pytest

      - name: Build backend image
        working-directory: .
        run: |
          docker build \
            --target app \
            --tag eirdom-household-backend:${GITHUB_REF_NAME} \
            backend

      - name: Inspect backend image
        working-directory: .
        run: |
          docker image inspect \
            eirdom-household-backend:${GITHUB_REF_NAME}
