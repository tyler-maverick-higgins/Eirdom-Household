name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: eirdom_household
          POSTGRES_USER: eirdom
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eirdom -d eirdom_household"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-django-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: eirdom_household
      POSTGRES_USER: eirdom
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run Ruff linting
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run Django system checks
        run: uv run python src/manage.py check

      - name: Check for missing migrations
        run: uv run python src/manage.py makemigrations --check

      - name: Run database migrations
        run: uv run python src/manage.py migrate --noinput

      - name: Run tests
        run: uv run pytest
