version: 2

updates:
    - package-ecosystem: uv
      directory: /backend
      schedule:
          interval: weekly
          day: monday
          time: "06:00"
          timezone: America/Chicago
      open-pull-requests-limit: 10
      labels:
          - dependencies
          - backend
      commit-message:
          prefix: "deps(backend)"
      groups:
          python-minor-and-patch:
              update-types:
                  - minor
                  - patch

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "06:15"
          timezone: America/Chicago
      open-pull-requests-limit: 5
      labels:
          - dependencies
          - docker
      commit-message:
          prefix: "deps(docker)"

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "06:30"
          timezone: America/Chicago
      open-pull-requests-limit: 5
      labels:
          - dependencies
          - github-actions
      commit-message:
          prefix: "deps(actions)"
