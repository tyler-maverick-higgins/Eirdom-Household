services:
    backend:
        build:
            context: ./backend
            target: app
        image: eirdom-household-backend:dev
        container_name: eirdom-household-backend
        working_dir: /app/src
        command: python manage.py runserver 0.0.0.0:8000
        env_file:
            - ./backend/.env
        volumes:
            - ./backend/src:/app/src
            - ./backend/bin:/app/bin
            - ./backend/pyproject.toml:/app/pyproject.toml:ro
        ports:
            - "8000:8000"
        depends_on:
            database:
                condition: service_healthy

    frontend:
        build:
            context: ./apps/web/frontend
        image: eirdom-household-frontend:dev
        container_name: eirdom-household-frontend
        working_dir: /workspace/apps/web/frontend
        user: root
        command: >
            sh -c "
                chown -R node:node /workspace/apps/web/frontend/node_modules &&
                su node -s /bin/sh -c 'npm run dev -- --host 0.0.0.0'
            "

        volumes:
            - .:/workspace
            - frontend_node_modules:/workspace/apps/web/frontend/node_modules
        ports:
            - "5173:5173"

    database:
        image: postgres:18
        container_name: eirdom-household-database
        env_file:
            - ./backend/.env
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres_data:
    frontend_node_modules:
