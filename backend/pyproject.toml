[project]
name = "eirdom-household-backend"
version = "0.1.0"
description = "Backend for the Eirdom Household management application."
authors = [
    { name = "Tyler Higgins" },
]
license = "MIT"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.0,<6.1",
    "djangorestframework>=3.17,<3.18",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
]
