[project]
name = "eirdom-household-backend"
version = "0.1.0"
description = "Backend for the Eirdom Household management application."
authors = [
    { name = "Tyler Higgins" },
]
license = "MIT"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.17.2,<3.18",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
python_files = [
    "tests.py",
    "test_*.py",
    "*_tests.py",
]

[tool.ruff]
target-version = "py314"
extend-exclude = [
    "*/migrations/*.py",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["EXE002"]
"**/tests/*.py" = ["EXE002"]
